
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VYRO">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYRO — Video Without The Clutter</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
.background-video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
  opacity: 0.45;
  pointer-events: none;
}

body {
  position: relative;
  overflow-x: hidden;
}

.container {
  position: relative;
  z-index: 1;
}
body {
  font-family: Arial, sans-serif;
  background: #020408;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(0, 110, 255, 0.18), transparent 35%),
    radial-gradient(circle at 80% 80%, rgba(0, 70, 160, 0.12), transparent 35%);
  background-size: 200% 200%;
  animation: vyroBackground 12s ease-in-out infinite;
  color: white;
  min-height: 100vh;
  overflow-x: hidden;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 0%, rgba(0, 120, 255, 0.12), transparent 45%);
  animation: vyroGlow 6s ease-in-out infinite;
  z-index: -1;
}

@keyframes vyroGlow {
  0%, 100% {
    opacity: 0.4;
  }

  50% {
    opacity: 1;
  }
}

.container {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 30px 20px;
  position: relative;
}

header {
  text-align: center;
  padding: 35px 0 25px;
}

.logo {
  font-size: clamp(45px, 12vw, 85px);
  font-weight: 900;
  letter-spacing: 10px;
  color: white;
  animation: vyroGlow 2.5s ease-in-out infinite;
}

@keyframes vyroGlow {
  0%, 100% {
    text-shadow:
      0 0 5px rgba(0, 100, 255, 0.2),
      0 0 15px rgba(0, 100, 255, 0.1);
  }

  50% {
    text-shadow:
      0 0 10px rgba(0, 150, 255, 0.9),
      0 0 25px rgba(0, 100, 255, 0.7),
      0 0 50px rgba(0, 80, 255, 0.4);
  }
}

.tagline {
  color: #9bb8e8;
  letter-spacing: 4px;
  font-size: 12px;
  margin-top: 10px;
}

.card {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  padding: 14px;
  border: 1px solid rgba(0, 140, 255, 0.35);
  border-radius: 22px;
  background: rgba(0, 8, 25, 0.78);
}

h1 {
  font-size: clamp(22px, 5vw, 32px);
  margin-bottom: 10px;
}

h2 {
  font-size: 22px;
  margin-bottom: 12px;
}

.subtitle {
  color: #9aa8bd;
  margin-bottom: 25px;
  line-height: 1.8;
}

.input-row {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  min-width: 0;
  background: #07101e;
  border: 1px solid #29435f;
  border-radius: 14px;
  padding: 17px;
  color: white;
  font-size: 15px;
  outline: none;
  direction: ltr;
}

input:focus {
  border-color: #168cff;
  box-shadow: 0 0 12px rgba(0,140,255,.25);
}

button {
  border: none;
  border-radius: 14px;
  padding: 0 25px;
  background: linear-gradient(135deg, #008cff, #0055ff);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  min-height: 54px;
  transition: .2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 20px rgba(0,140,255,.35);
}

button:active {
  transform: scale(.97);
}

.message {
  display: none;
  margin-top: 18px;
  padding: 15px;
  border-radius: 12px;
  background: #071b32;
  border: 1px solid #164d80;
  color: #b9d9ff;
  line-height: 1.8;
}

.message.show {
  display: block;
}
.features {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  align-items: stretch;
}

.feature {
  min-height: 170px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px 16px;
  border-radius: 18px;
  box-sizing: border-box;
}

/* ترتيب البطاقات في الجوال */
@media (max-width: 600px) {
  .features {
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .feature {
    min-height: 150px;
    width: 100%;
  }

}

.feature-icon {
  font-size: 25px;
  margin-bottom: 10px;
}

.feature strong {
  display: block;
  margin-bottom: 7px;
}

.feature span {
  color: #8495ad;
  font-size: 12px;
  line-height: 1.7;
}

.link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 16px;
  border: 1px solid #183552;
  border-radius: 14px;
  background: #07101e;
  color: white;
  text-decoration: none;
  transition: .2s;
}

.link:hover {
  border-color: #168cff;
  background: #0a1a2d;
}

.link small {
  color: #7f94ad;
}

footer {
  text-align: center;
  color: #52657c;
  font-size: 12px;
  padding: 35px 0 10px;
}

@media (max-width: 600px) {
  .container {
    padding: 14px 10px;
  }

  .card {
    padding: 14px;
  }

  .input-row {
    flex-direction: column;
  }

  button {
    width: 100%;
  }

  .features {
    grid-template-columns: 1fr;
  }

 /* وميض كهربائي حول إطار التحميل */
.card:first-of-type {
  position: relative;
  border: 2px solid #00aaff;
  border-radius: 18px;
  animation: electricFlash 2.2s infinite;
}

@keyframes electricFlash {
  0%, 100% {
    border-color: #006eff;
    box-shadow: 0 0 5px #006eff;
  }

  50% {
    border-color: #ffffff;
    box-shadow:
      0 0 10px #00aaff,
      0 0 25px #006eff,
      0 0 45px #00aaff;
  }
}
}
</style>
</head>

<body>

<video class="background-video" autoplay muted loop playsinline>
  <source src="lv_0_٢٠٢٦٠٩٠٧١٧٠٤٤٢~3.mp4" type="video/mp4">
</video>
<audio id="siteSound" src="./site-sound.mp3" preload="auto"></audio>

<script>
  const siteSound = document.getElementById("siteSound");

  document.addEventListener("click", function () {
    siteSound.volume = 1.0;
    siteSound.play();
  }, { once: true });
</script>

<div class="container">
  <header>
    <div class="logo">⚡VYRO⚡</div>
    <div class="tagline">VIDEO WITHOUT THE CLUTTER</div>
  </header>

  <section class="card">
    <h1>تحميل فيديو TikTok او instagram </h1>
    <p class="subtitle">
      الصق رابط فيديو TikTok في الأسفل للبدء.
    </p>

    <div class="input-row">
      <input
        id="videoUrl"
        type="url"
        placeholder="https://www.tiktok.com/..."
        autocomplete="off"
      >
      <button onclick="checkVideo()">تحميل</button>
    </div>

    <div id="message" class="message"></div>
  </section>

  <div class="features">
    <div class="feature">
      <div class="feature-icon">⚡</div>
      <strong>سريع</strong>
      <span>واجهة خفيفة وسهلة الاستخدام.</span>
    </div>

    <div class="feature">
      <div class="feature-icon">🔒</div>
      <strong>بسيط</strong>
      <span>بدون تسجيل أو خطوات معقدة.</span>
    </div>

    <div class="feature">
      <div class="feature-icon">📱</div>
      <strong>متوافق</strong>
      <span>مصمم للجوال والكمبيوتر.</span>
    </div>
  </div>


  <footer>
    © 2026 VYRO — المطور الوليد
  </footer>

</div>

<script>
async function checkVideo() {
  const input = document.getElementById("videoUrl");
  const message = document.getElementById("message");
  const url = input.value.trim();

  if (!url) {
    message.textContent = "ألصق رابط الفيديو أولاً.";
    message.classList.add("show");
    return;
  }

  let apiUrl = "";

  if (url.includes("tiktok.com")) {
    apiUrl = "https://vyro-backend.onrender.com/api/download";
  } else if (url.includes("instagram.com")) {
    apiUrl = "https://vyro-backend.onrender.com/api/instagram-download";
  } else {
    message.textContent = "ضع رابط TikTok أو Instagram صحيح.";
    message.classList.add("show");
    return;
  }

  message.textContent = "جاري جلب الفيديو...";
  message.classList.add("show");

  try {
    const response = await fetch(apiUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ url })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "تعذر الحصول على الفيديو");
    }

    if (url.includes("tiktok.com")) {
  message.innerHTML = `
    <button onclick="downloadTikTok('${encodeURIComponent(url)}')">
      تحميل الفيديو
    </button>
  `;
    } else {
      message.innerHTML = `
        <a href="${data.video}" target="_blank" rel="noopener">
          تحميل فيديو Instagram
        </a>
      `;
    }

  } catch (error) {
    message.textContent = "حدث خطأ أثناء جلب الفيديو.";
    console.error(error);
  }
}
  async function downloadTikTok(encodedUrl) {
  try {
    const url = decodeURIComponent(encodedUrl);

    const response = await fetch(
      `https://vyro-backend.onrender.com/api/download-file?url=${encodeURIComponent(url)}`
    );

    if (!response.ok) {
      throw new Error("فشل تحميل الفيديو");
    }

    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = "VYRO-video.mp4";
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);

  } catch (error) {
    console.error(error);
    alert("تعذر تنزيل الفيديو");
  }
  }
</script>

</body>
</html>
